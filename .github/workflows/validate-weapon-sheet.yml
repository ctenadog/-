name: Validate weapon sheet
on:
  push:
    paths:
      - 'weapon_sheet.json'
      - 'tools/validate_weapon_sheet.py'
      - '.github/workflows/validate-weapon-sheet.yml'
  pull_request:
    paths:
      - 'weapon_sheet.json'
      - 'tools/validate_weapon_sheet.py'
      - '.github/workflows/validate-weapon-sheet.yml'
  workflow_dispatch:
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Validate complete 12-weapon design sheet
        run: python tools/validate_weapon_sheet.py weapon_sheet.json
